services:
  app:
    platform: linux/amd64
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:?BETTER_AUTH_TRUSTED_ORIGINS is required}
      STORAGE_DRIVER: local
      LOCAL_STORAGE_ROOT: /data/uploads
    ports:
      - name: app-http
        target: 3000
        published: "${APP_PORT:-3000}"
        host_ip: 127.0.0.1
        protocol: tcp
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: 2.0
    mem_limit: 2g
    mem_reservation: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - product_hub_frontend
      - product_hub_backend
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  migration:
    platform: linux/amd64
    profiles: ["operations"]
    build:
      context: .
      target: migrator
    environment:
      NODE_ENV: production
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER is required}
    command:
      [
        "sh",
        "-c",
        "node ./node_modules/prisma/build/index.js migrate deploy && node ./node_modules/tsx/dist/cli.mjs scripts/configure-runtime-role.ts",
      ]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - product_hub_backend

  postgres:
    restart: unless-stopped
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Dedicated bootstrap admin user is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Dedicated bootstrap admin password is required}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:?MIGRATION_DB_USER is required}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?MIGRATION_DB_PASSWORD is required}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER is required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    volumes:
      - ${PRODUCT_HUB_POSTGRES_INIT_DIR:-/opt/product-hub/config/postgres/init-production}:/docker-entrypoint-initdb.d:ro
    pids_limit: 256
    cpus: 2.0
    mem_limit: 2g
    mem_reservation: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  product_hub_frontend:
    internal: false
  product_hub_backend:
    internal: true
